# Test site on GitHub Pages (https://q-leap.github.io/q-leap-website/), from the dev branch, until
# the switch of q-leap.eu. Every page gets <meta name="robots" content="noindex, nofollow"> so the
# copy is not indexed instead of q-leap.eu; the repository files are not changed.
name: Deploy test site

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [Build content]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Site files only, not indexed
        run: |
          mkdir _site
          git ls-files -z | grep -zvE '^(tools|content|docs|\.github)/|^(\.pages\.yml|CLAUDE\.md|README\.md|package\.json|\.gitignore)$' | xargs -0 cp --parents -t _site
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<head([^>]*)>/<head$1>\n<meta name="robots" content="noindex, nofollow">/i'
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
