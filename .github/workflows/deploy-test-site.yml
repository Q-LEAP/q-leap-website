# Test site on GitHub Pages (https://q-leap.github.io/q-leap-website/), from the dev branch, until
# the switch of q-leap.eu; the UXEnhance branch is published next to it, in /ux-enhance/ (refreshed
# with every dev deployment, or with « Run workflow » on dev). Every page gets <meta name="robots" content="noindex, nofollow"> so the
# copy is not indexed instead of q-leap.eu (the WordPress robots tags are removed from the copy);
# the repository files are not changed.
name: Deploy test site

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [Build content]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/checkout@v4
        with:
          ref: UXEnhance
          path: ux
      - name: Site files only, not indexed
        run: |
          copy_site() {
            mkdir -p "$2"
            (cd "$1" && git ls-files -z | grep -zvE '^(tools|content|docs|\.github)/|^(\.pages\.yml|CLAUDE\.md|README\.md|package\.json|\.gitignore)$' | xargs -0 cp --parents -t "$2")
          }
          pip install pillow fonttools brotli
          # Page speed on the published copy only (tools/perf/optimize.py): one stylesheet per page,
          # WebP images, lazy loading. Each site is optimized with its own scripts and assets.
          copy_site dev "$PWD/_site"
          python3 dev/tools/perf/optimize.py --root _site
          copy_site ux "$PWD/_site/ux-enhance"
          python3 ux/tools/perf/optimize.py --root _site/ux-enhance || python3 dev/tools/perf/optimize.py --root _site/ux-enhance
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<meta name=["\x27]robots["\x27][^>]*>\s*//gi; s/<head([^>]*)>/<head$1>\n<meta name="robots" content="noindex, nofollow">/i'
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
