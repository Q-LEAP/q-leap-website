# Production: publishes https://q-leap.eu/ on GitHub Pages from the dev branch (the only branch the
# github-pages environment accepts), at every push and after each Build content run. It replaces
# the test-site workflow (deploy-test-site.yml): since q-leap.eu is the Pages custom domain, there is
# no separate test address any more, and this copy must be indexable.
#
# What differs from the test site:
# - the pages keep their own robots tags (Yoast's, noindex on redirect and search pages), no
#   site-wide noindex;
# - robots.txt and sitemap_index.xml / sitemap.xml are the repository's (generated by
#   tools/search/build.py), so search engines find every indexable page;
# - the UXEnhance branch stays published in /ux-enhance/ for the team, but not indexed: noindex on
#   its pages and Disallow: /ux-enhance/ in robots.txt.
# The domain itself (q-leap.eu, HTTPS) is set in the repository's Pages settings, not here.
name: Deploy q-leap.eu

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [Build content]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/checkout@v4
        with:
          ref: UXEnhance
          path: ux
      - name: Site files only
        run: |
          copy_site() {
            mkdir -p "$2"
            (cd "$1" && git ls-files -z | grep -zvE '^(tools|content|docs|\.github)/|^(\.pages\.yml|CLAUDE\.md|README\.md|package\.json|\.gitignore)$' | xargs -0 cp --parents -t "$2")
          }
          pip install pillow fonttools brotli
          # Page speed on the published copy only (tools/perf/optimize.py): one stylesheet per page,
          # WebP images, lazy loading. Each site is optimized with its own scripts and assets.
          copy_site dev "$PWD/_site"
          python3 dev/tools/perf/optimize.py --root _site
          copy_site ux "$PWD/_site/ux-enhance"
          python3 ux/tools/perf/optimize.py --root _site/ux-enhance || python3 dev/tools/perf/optimize.py --root _site/ux-enhance
          # The UX preview is for the team only: not indexed (its pages and robots.txt)
          find _site/ux-enhance -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<meta name=["\x27]robots["\x27][^>]*>\s*//gi; s/<head([^>]*)>/<head$1>\n<meta name="robots" content="noindex, nofollow">/i'
          rm -f _site/ux-enhance/robots.txt _site/ux-enhance/sitemap.xml _site/ux-enhance/sitemap_index.xml
          perl -0pi -e 's/^(User-agent: \*\r?\n)/$1Disallow: \/ux-enhance\/\n/m or $_ .= "\nUser-agent: *\nDisallow: \/ux-enhance\/\n"' _site/robots.txt
          touch _site/.nojekyll
      - name: Check the copy is indexable
        run: |
          # A site-wide noindex or a robots.txt that blocks everything would remove q-leap.eu from Google.
          if grep -qE '^Disallow: /\s*$' _site/robots.txt; then echo "robots.txt blocks the whole site"; exit 1; fi
          if grep -qiE 'name=["\x27]robots["\x27] content=["\x27][^"\x27]*noindex' _site/index.html _site/en/index.html; then echo "home page is noindex"; exit 1; fi
          test -s _site/sitemap.xml && test -s _site/sitemap_index.xml && test -f _site/404.html
          echo "OK: $(grep -c '<loc>' _site/sitemap.xml) pages in the sitemap"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The artifact (site + ux-enhance copy) is ~420 MB: GitHub's file sync took 4-9 min and
          # now exceeds the action's default 10 min wait.
          timeout: 1800000
