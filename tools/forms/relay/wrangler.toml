# Cloudflare Worker that mails the site's forms through Brevo (see worker.js and README.md).
name = "qleap-forms"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
RECIPIENT = "digital@q-leap.eu"
SENDER_EMAIL = "bot@q-leap.eu" # already a verified sender in Q-Leap's Brevo account
SENDER_NAME = "Site q-leap.eu"
ALLOWED_ORIGINS = "https://q-leap.eu,https://www.q-leap.eu,https://q-leap.github.io"
# Secret, never in this file: npx wrangler secret put BREVO_API_KEY
