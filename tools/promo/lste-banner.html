<aside class="lste-promo" id="lste-promo" aria-label="{{aria}}">
 <div class="lste-promo__in">
  <a class="lste-promo__logo" href="https://www.lste.lu/" target="_blank" rel="noopener" aria-label="LSTE — Luxembourg Software Testing Event">
   <svg xmlns="http://www.w3.org/2000/svg" viewBox="312 640 875 219" aria-hidden="true" focusable="false">{{logo}}</svg>
   <span class="lste-promo__date">{{date}}</span>
  </a>
  <p class="lste-promo__text">{{text}}</p>
  <a class="lste-promo__cta" href="https://www.lste.lu/register/" target="_blank" rel="noopener"><span class="lste-promo__full">{{cta}}</span><span class="lste-promo__short">{{ctaShort}}</span> <span aria-hidden="true">→</span></a>
  <button type="button" class="lste-promo__close" aria-label="{{close}}"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
 </div>
</aside>
